<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | HJC Admin</title>
    <!-- RUTAS CORREGIDAS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">

    <div class="login-card">
        <h1>HJC <span>Admin</span></h1>
        <p class="login-sub">Acceso al panel de administración</p>

        <form id="login-form">
            <div class="form-group">
                <label for="user">Usuario</label>
                <input type="text" id="user" name="user" required autocomplete="username" placeholder="Tu usuario">
            </div>
            <div class="form-group">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" name="pass" required autocomplete="current-password" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            <p id="login-error" class="login-error"></p>
        </form>

        <a href="index.html" class="login-volver">← Volver al sitio</a>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
